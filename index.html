<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sole Vault — Shared Shoe Catalog</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-gray-900 uppercase">Sole Vault</h1>
        <p class="text-xs text-gray-500">Shared Footwear Catalog for Styling & Shoots</p>
      </div>
      <button onclick="toggleUploadModal(true)" class="bg-black text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-gray-800 transition">
        + Add Shoe
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Filter Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 space-y-4">
      <!-- Search Input -->
      <div>
        <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search brand or keywords..." class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-black">
      </div>

      <!-- Dropdown Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Owner</label>
          <select id="filterOwner" onchange="renderApp()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Owners</option>
            <option value="Kristina">Kristina</option>
            <option value="Friend 1">Friend 1</option>
            <option value="Friend 2">Friend 2</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Gender / Fit</label>
          <select id="filterGender" onchange="renderApp()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Fits</option>
            <option value="Women's">Women's</option>
            <option value="Men's">Men's</option>
            <option value="Unisex">Unisex</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">EU Size</label>
          <select id="filterSize" onchange="renderApp()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Sizes</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Category</label>
          <select id="filterCategory" onchange="renderApp()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Categories</option>
            <option value="Boots">Boots</option>
            <option value="Heels">Heels</option>
            <option value="Sandals">Sandals</option>
            <option value="Loafers">Loafers</option>
            <option value="Mules">Mules</option>
            <option value="Sneakers">Sneakers</option>
            <option value="Platforms">Platforms</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Heel Height</label>
          <select id="filterHeel" onchange="renderApp()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Heights</option>
            <option value="Flat">Flat (0-2cm)</option>
            <option value="Low">Low (3-5cm)</option>
            <option value="Mid">Mid (6-8cm)</option>
            <option value="High">High (9cm+)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Color</label>
          <select id="filterColor" onchange="renderApp()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Colors</option>
            <option value="Black">Black</option>
            <option value="White">White / Off-White</option>
            <option value="Beige">Beige / Nude</option>
            <option value="Brown">Brown / Tan</option>
            <option value="Grey">Grey / Silver</option>
            <option value="Gold">Gold / Bronze</option>
            <option value="Red">Red / Crimson</option>
            <option value="Burgundy">Burgundy</option>
            <option value="Pink">Pink</option>
            <option value="Purple">Purple</option>
            <option value="Blue">Blue / Navy</option>
            <option value="Green">Green / Olive</option>
            <option value="Yellow">Yellow</option>
            <option value="Orange">Orange</option>
            <option value="Multi">Multi-color</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Texture</label>
          <select id="filterTexture" onchange="renderApp()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Textures</option>
            <option value="Matte Leather">Matte Leather</option>
            <option value="Patent Leather">Patent Leather</option>
            <option value="Suede">Suede / Nubuck</option>
            <option value="Velvet">Velvet / Satin</option>
            <option value="Canvas">Canvas / Denim</option>
            <option value="Mesh">Mesh / Sheer</option>
            <option value="Metallic">Metallic</option>
            <option value="Embossed">Embossed / Snake</option>
            <option value="Faux Fur">Faux Fur</option>
            <option value="Rubber">Rubber / PVC</option>
            <option value="Glitter">Glitter / Rhinestone</option>
            <option value="Distressed">Distressed</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Inventory Gallery Grid -->
    <div id="shoeGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <!-- Detail Lightbox Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4" onclick="closeDetailModalOnBackdrop(event)">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col md:flex-row relative">
      <button onclick="toggleDetailModal(false)" class="absolute top-3 right-3 z-10 bg-black/50 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-black transition">✕</button>
      
      <!-- Big Image View -->
      <div class="md:w-1/2 bg-gray-100 flex items-center justify-center p-4">
        <img id="detailImage" src="" alt="" class="max-h-[60vh] md:max-h-[80vh] w-full object-contain rounded-lg">
      </div>

      <!-- Info Sidebar -->
      <div class="md:w-1/2 p-6 flex flex-col justify-between overflow-y-auto">
        <div>
          <div class="flex justify-between items-start mb-2">
            <span id="detailOwner" class="text-xs bg-black text-white px-2.5 py-1 rounded-full font-bold uppercase tracking-wider"></span>
            <span id="detailDate" class="text-xs text-gray-400"></span>
          </div>
          <h2 id="detailBrand" class="text-2xl font-black text-gray-900 mb-4"></h2>

          <div class="space-y-3 text-sm">
            <div class="flex justify-between border-b pb-2">
              <span class="text-gray-500 font-medium">EU Size</span>
              <span id="detailSize" class="font-bold text-gray-900"></span>
            </div>
            <div class="flex justify-between border-b pb-2">
              <span class="text-gray-500 font-medium">Gender / Fit</span>
              <span id="detailGender" class="font-bold text-gray-900"></span>
            </div>
            <div class="flex justify-between border-b pb-2">
              <span class="text-gray-500 font-medium">Category</span>
              <span id="detailCategory" class="font-bold text-gray-900"></span>
            </div>
            <div class="flex justify-between border-b pb-2">
              <span class="text-gray-500 font-medium">Heel Height</span>
              <span id="detailHeel" class="font-bold text-gray-900"></span>
            </div>
            <div class="flex justify-between border-b pb-2">
              <span class="text-gray-500 font-medium">Color(s)</span>
              <span id="detailColor" class="font-bold text-gray-900"></span>
            </div>
            <div class="flex justify-between border-b pb-2">
              <span class="text-gray-500 font-medium">Texture</span>
              <span id="detailTexture" class="font-bold text-gray-900"></span>
            </div>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button onclick="deleteCurrentShoe()" id="deleteBtn" class="w-1/2 border border-red-200 bg-red-50 text-red-600 py-2.5 rounded-lg text-sm font-semibold hover:bg-red-100 transition">
            Delete Pair
          </button>
          <button onclick="toggleDetailModal(false)" class="w-1/2 border border-gray-300 py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-50 transition">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Shoe Modal -->
  <div id="uploadModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">Add Pair to Vault</h2>
        <button onclick="toggleUploadModal(false)" class="text-gray-400 hover:text-black">✕</button>
      </div>

      <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Photo</label>
          <input type="file" id="shoeImage" accept="image/*" required class="w-full text-xs text-gray-500 border border-gray-200 rounded-md p-2">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Owner</label>
            <select id="addOwner" required class="w-full p-2 border rounded-md text-xs">
              <option value="Kristina">Kristina</option>
              <option value="Friend 1">Friend 1</option>
              <option value="Friend 2">Friend 2</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Gender/Fit</label>
            <select id="addGender" required class="w-full p-2 border rounded-md text-xs">
              <option value="Women's">Women's</option>
              <option value="Men's">Men's</option>
              <option value="Unisex">Unisex</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Brand / Style Name</label>
          <input type="text" id="addBrand" required placeholder="e.g. Prada Chunky Loafers" class="w-full p-2 border rounded-md text-xs">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">EU Size</label>
            <input type="number" step="0.5" id="addSize" required placeholder="38" class="w-full p-2 border rounded-md text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Category</label>
            <select id="addCategory" required class="w-full p-2 border rounded-md text-xs">
              <option value="Boots">Boots</option>
              <option value="Heels">Heels</option>
              <option value="Sandals">Sandals</option>
              <option value="Loafers">Loafers</option>
              <option value="Mules">Mules</option>
              <option value="Sneakers">Sneakers</option>
              <option value="Platforms">Platforms</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Heel Height</label>
            <select id="addHeel" required class="w-full p-2 border rounded-md text-xs">
              <option value="Flat">Flat</option>
              <option value="Low">Low</option>
              <option value="Mid">Mid</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Color</label>
            <select id="addColor" required class="w-full p-2 border rounded-md text-xs">
              <option value="Black">Black</option>
              <option value="White">White / Off-White</option>
              <option value="Beige">Beige / Nude</option>
              <option value="Brown">Brown / Tan</option>
              <option value="Grey">Grey / Silver</option>
              <option value="Gold">Gold / Bronze</option>
              <option value="Red">Red / Crimson</option>
              <option value="Burgundy">Burgundy</option>
              <option value="Pink">Pink</option>
              <option value="Purple">Purple</option>
              <option value="Blue">Blue / Navy</option>
              <option value="Green">Green / Olive</option>
              <option value="Yellow">Yellow</option>
              <option value="Orange">Orange</option>
              <option value="Multi">Multi-color</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Texture</label>
            <select id="addTexture" required class="w-full p-2 border rounded-md text-xs">
              <option value="Matte Leather">Matte Leather</option>
              <option value="Patent Leather">Patent Leather</option>
              <option value="Suede">Suede / Nubuck</option>
              <option value="Velvet">Velvet / Satin</option>
              <option value="Canvas">Canvas / Denim</option>
              <option value="Mesh">Mesh / Sheer</option>
              <option value="Metallic">Metallic</option>
              <option value="Embossed">Embossed</option>
              <option value="Faux Fur">Faux Fur</option>
              <option value="Rubber">Rubber / PVC</option>
              <option value="Glitter">Glitter</option>
              <option value="Distressed">Distressed</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-black text-white font-semibold py-2.5 rounded-lg text-sm hover:bg-gray-800 transition">
          Compress & Save Pair
        </button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tmjlpaqrmymjlvsavtpo.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_PUBLISHABLE_KEY_HERE"; // PASTE YOUR PUBLISHABLE KEY HERE
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allShoes = [];
    let currentShoeId = null;

    // Populate EU Sizes 34 to 46
    const sizeSelect = document.getElementById('filterSize');
    for (let s = 34; s <= 46; s += 0.5) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = `EU ${s}`;
      sizeSelect.appendChild(opt);
    }

    function toggleUploadModal(show) {
      document.getElementById('uploadModal').classList.toggle('hidden', !show);
    }

    function toggleDetailModal(show) {
      document.getElementById('detailModal').classList.toggle('hidden', !show);
    }

    function closeDetailModalOnBackdrop(e) {
      if (e.target.id === 'detailModal') toggleDetailModal(false);
    }

    function openShoeDetail(id) {
      const shoe = allShoes.find(item => item.id === id);
      if (!shoe) return;

      currentShoeId = id;
      document.getElementById('detailImage').src = shoe.image_url;
      document.getElementById('detailOwner').innerText = shoe.owner || 'Unknown Owner';
      document.getElementById('detailBrand').innerText = shoe.brand || 'Untitled Pair';
      document.getElementById('detailSize').innerText = shoe.size_eu ? `EU ${shoe.size_eu}` : 'N/A';
      document.getElementById('detailGender').innerText = shoe.gender || 'N/A';
      document.getElementById('detailCategory').innerText = shoe.category || 'N/A';
      document.getElementById('detailHeel').innerText = shoe.heel_height || 'N/A';
      document.getElementById('detailColor').innerText = Array.isArray(shoe.color) ? shoe.color.join(', ') : (shoe.color || 'N/A');
      document.getElementById('detailTexture').innerText = Array.isArray(shoe.texture) ? shoe.texture.join(', ') : (shoe.texture || 'N/A');
      document.getElementById('detailDate').innerText = shoe.created_at ? new Date(shoe.created_at).toLocaleDateString() : '';

      toggleDetailModal(true);
    }

    async function deleteCurrentShoe() {
      if (!currentShoeId) return;
      if (!confirm("Are you sure you want to delete this pair from the catalog?")) return;

      const deleteBtn = document.getElementById('deleteBtn');
      deleteBtn.innerText = "Deleting...";
      deleteBtn.disabled = true;

      try {
        const shoe = allShoes.find(item => item.id === currentShoeId);
        if (shoe && shoe.image_url) {
          const fileName = shoe.image_url.split('/').pop();
          if (fileName) {
            await db.storage.from('shoe-photos').remove([fileName]);
          }
        }

        const { error } = await db.from('shoes').delete().eq('id', currentShoeId);
        if (error) throw error;

        toggleDetailModal(false);
        fetchShoes();
      } catch (err) {
        alert("Delete failed: " + err.message);
      } finally {
        deleteBtn.innerText = "Delete Pair";
        deleteBtn.disabled = false;
      }
    }

    function compressImage(file, maxWidth = 1200, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
          };
        };
      });
    }

    async function fetchShoes() {
      const { data, error } = await db.from('shoes').select('*').order('created_at', { ascending: false });
      if (!error && data) {
        allShoes = data;
        renderApp();
      }
    }

    async function handleUpload(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Compressing & Uploading...";
      submitBtn.disabled = true;

      try {
        const file = document.getElementById('shoeImage').files[0];
        const compressedBlob = await compressImage(file);

        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
        const { data: storageData, error: storageError } = await db.storage
          .from('shoe-photos')
          .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

        if (storageError) throw storageError;

        const { data: urlData } = db.storage.from('shoe-photos').getPublicUrl(fileName);

        const newShoe = {
          owner: document.getElementById('addOwner').value,
          gender: document.getElementById('addGender').value,
          brand: document.getElementById('addBrand').value,
          size_eu: parseFloat(document.getElementById('addSize').value),
          category: document.getElementById('addCategory').value,
          heel_height: document.getElementById('addHeel').value,
          color: [document.getElementById('addColor').value],
          texture: [document.getElementById('addTexture').value],
          image_url: urlData.publicUrl
        };

        const { error: dbError } = await db.from('shoes').insert([newShoe]);
        if (dbError) throw dbError;

        document.getElementById('uploadForm').reset();
        toggleUploadModal(false);
        fetchShoes();
      } catch (err) {
        alert("Upload failed: " + err.message);
      } finally {
        submitBtn.innerText = "Compress & Save Pair";
        submitBtn.disabled = false;
      }
    }

    function renderApp() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const owner = document.getElementById('filterOwner').value;
      const gender = document.getElementById('filterGender').value;
      const size = document.getElementById('filterSize').value;
      const category = document.getElementById('filterCategory').value;
      const heel = document.getElementById('filterHeel').value;
      const color = document.getElementById('filterColor').value;
      const texture = document.getElementById('filterTexture').value;

      const filtered = allShoes.filter(shoe => {
        const matchSearch = (shoe.brand || "").toLowerCase().includes(search);
        const matchOwner = owner === 'All' || shoe.owner === owner;
        const matchGender = gender === 'All' || shoe.gender === gender;
        const matchSize = size === 'All' || shoe.size_eu == size;
        const matchCategory = category === 'All' || shoe.category === category;
        const matchHeel = heel === 'All' || shoe.heel_height === heel;
        const matchColor = color === 'All' || (Array.isArray(shoe.color) ? shoe.color.includes(color) : shoe.color === color);
        const matchTexture = texture === 'All' || (Array.isArray(shoe.texture) ? shoe.texture.includes(texture) : shoe.texture === texture);

        return matchSearch && matchOwner && matchGender && matchSize && matchCategory && matchHeel && matchColor && matchTexture;
      });

      const grid = document.getElementById('shoeGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No shoes matching current filters.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(shoe => `
        <div onclick="openShoeDetail(${shoe.id})" class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-0.5 cursor-pointer transition">
          <img src="${shoe.image_url}" alt="${shoe.brand}" class="w-full h-56 object-cover bg-gray-100">
          <div class="p-4">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-base text-gray-900">${shoe.brand}</h3>
              <span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600 font-medium">${shoe.owner}</span>
            </div>
            <div class="flex flex-wrap gap-1 text-[11px] text-gray-600">
              <span class="bg-gray-50 border px-1.5 py-0.5 rounded">EU ${shoe.size_eu}</span>
              <span class="bg-gray-50 border px-1.5 py-0.5 rounded">${shoe.gender}</span>
              <span class="bg-gray-50 border px-1.5 py-0.5 rounded">${shoe.category}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    fetchShoes();
  </script>
</body>
</html>
