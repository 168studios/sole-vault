<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sole Vault — Shared Shoe Catalog</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-gray-900 uppercase">Sole Vault</h1>
        <p class="text-xs text-gray-500">Shared Footwear Catalog for Styling & Shoots</p>
      </div>
      <button onclick="toggleUploadModal(true)"
        class="bg-black text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-gray-800 transition">
        + Add Shoe
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Filter Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 space-y-4">

      <div>
        <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search brand or keywords..."

        <div class="text-right mt-1.5">
          <span id="shoeCounter" class="text-xs text-gray-400 font-medium">Currently 0 pairs available</span>
        </div>
      </div>

        <!-- Dynamic Owner Filter -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Owner</label>
          <select id="filterOwner" onchange="renderApp()"
            class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Owners</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Gender / Fit</label>
          <select id="filterGender" onchange="renderApp()"
            class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Fits</option>
            <option value="Women's">Women's</option>
            <option value="Men's">Men's</option>
            <option value="Unisex">Unisex</option>

        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">EU Size</label>
          <select id="filterSize" onchange="renderApp()"
            class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Sizes</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Category</label>
          <select id="filterCategory" onchange="renderApp()"
            class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Categories</option>
            <option value="Boots">Boots</option>
            <option value="Heels">Heels</option>
            <option value="Sandals">Sandals</option>
            <option value="Loafers">Loafers</option>
            <option value="Mules">Mules</option>
            <option value="Sneakers">Sneakers</option>

        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Heel Height</label>
          <select id="filterHeel" onchange="renderApp()"

            <option value="All">All Heights</option>
            <option value="Flat">Flat (0-2cm)</option>
            <option value="Low">Low (3-5cm)</option>
            <option value="Mid">Mid (6-8cm)</option>
            <option value="High">High (9cm+)</option>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Color</label>
          <select id="filterColor" onchange="renderApp()"
            class="w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-xs">
            <option value="All">All Colors</option>
            <option value="Black">Black</option>

            <option value="Beige">Beige / Nude</option>
            <option value="Brown">Brown / Tan</option>
            <option value="Grey">Grey / Silver</option>
            <option value="Gold">Gold / Bronze</option>
            <option value="Red">Red / Crimson</option>
            <option value="Burgundy">Burgundy</option>
            <option value="Pink">Pink</option>
            <option value="Purple">Purple</option>
            <option value="Blue">Blue / Navy</option>
            <option value="Green">Green / Olive</option>
            <option value="Yellow">Yellow</option>

            <option value="Patent Leather">Patent Leather</option>

            <div class="flex justify-between border-b pb-2">

        <div class="mt-6 flex gap-3">

    </div>

  <script>
    const SUPABASE_URL = "https://tmjlpaqrmymjlvsavtpo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1jNV0fFJ64iceGvBUfdBpg_Vc4qd9Ed"; // PASTE YOUR KEY HERE

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allShoes = [];
    let currentShoeId = null;
    let activeImages = [];
    let activeImageIdx = 0;

    const sizeSelect = document.getElementById('filterSize');
    for (let s = 34; s <= 46; s += 0.5) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = `EU ${s}`;
      sizeSelect.appendChild(opt);
    }

    function toggleUploadModal(show) {
      document.getElementById('uploadModal').classList.toggle('hidden', !show);
    }

    function toggleDetailModal(show) {
      document.getElementById('detailModal').classList.toggle('hidden', !show);
    }

    function closeDetailModalOnBackdrop(e) {
      if (e.target.id === 'detailModal') toggleDetailModal(false);
    }

    function updateOwnerDropdowns() {
      const filterSelect = document.getElementById('filterOwner');
      const addSelect = document.getElementById('addOwner');

      const uniqueOwners = [...new Set(allShoes.map(shoe => shoe.owner).filter(Boolean))].sort();

      const currentFilterVal = filterSelect.value;
      filterSelect.innerHTML = `<option value="All">All Owners</option>`;
      uniqueOwners.forEach(owner => {
        filterSelect.innerHTML += `<option value="${owner}">${owner}</option>`;
      });
      filterSelect.value = uniqueOwners.includes(currentFilterVal) ? currentFilterVal : 'All';

      const currentAddVal = addSelect.value;
      addSelect.innerHTML = `
        <option value="" disabled selected hidden>Select Owner</option>
        ${uniqueOwners.map(owner => `<option value="${owner}">${owner}</option>`).join('')}
        <option value="__NEW__">+ Add New Owner...</option>
      `;
      addSelect.value = currentAddVal || "";
    }

    document.getElementById('addOwner').addEventListener('change', function (e) {
      if (e.target.value === '__NEW__') {
        const newName = prompt("Enter new owner name:");
        if (newName && newName.trim() !== '') {
          const cleanName = newName.trim();
          const addSelect = document.getElementById('addOwner');
          const exists = Array.from(addSelect.options).some(opt => opt.value === cleanName);

          if (!exists) {
            const opt = document.createElement('option');
            opt.value = cleanName;
            opt.textContent = cleanName;
            addSelect.insertBefore(opt, addSelect.lastElementChild);
          }
          addSelect.value = cleanName;
        } else {
          e.target.value = "";
        }
      }
    });

    function previewCardImage(num) {
      const input = document.getElementById(`shoeImage${num}`);
      const preview = document.getElementById(`previewImg${num}`);
      const content = document.getElementById(`cardContent${num}`);
      const removeBtn = document.getElementById(`removeBtn${num}`);

      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          preview.classList.remove('hidden');
          content.classList.add('hidden');
          removeBtn.classList.remove('hidden');
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function clearCardImage(e, num) {
      e.stopPropagation();
      const input = document.getElementById(`shoeImage${num}`);
      const preview = document.getElementById(`previewImg${num}`);
      const content = document.getElementById(`cardContent${num}`);
      const removeBtn = document.getElementById(`removeBtn${num}`);

      input.value = "";
      preview.src = "";
      preview.classList.add('hidden');
      content.classList.remove('hidden');
      removeBtn.classList.add('hidden');
    }

    function updateCardProgress(num, percent, status = "Uploading...") {
      const box = document.getElementById(`progressBox${num}`);
      const bar = document.getElementById(`bar${num}`);
      const percentTxt = document.getElementById(`percentTxt${num}`);
      const statusTxt = document.getElementById(`statusTxt${num}`);

      if (percent <= 0) {
        box.classList.add('hidden');
        bar.style.width = '0%';
      } else {
        box.classList.remove('hidden');
        bar.style.width = `${percent}%`;
        percentTxt.innerText = `${percent}%`;
        statusTxt.innerText = status;
      }
    }

    function openShoeDetail(id) {
      const shoe = allShoes.find(item => item.id === id);
      if (!shoe) return;

      currentShoeId = id;

      if (Array.isArray(shoe.image_url)) {
        activeImages = shoe.image_url;
      } else if (typeof shoe.image_url === 'string' && shoe.image_url.startsWith('[')) {
        try {activeImages = JSON.parse(shoe.image_url);} catch {activeImages = [shoe.image_url];}
      } else {
        activeImages = [shoe.image_url];
      }

      activeImageIdx = 0;
      updateLightboxDisplay();

      document.getElementById('detailOwner').innerText = shoe.owner || 'Unknown Owner';
      document.getElementById('detailBrand').innerText = shoe.brand || 'Untitled Pair';
      document.getElementById('detailSize').innerText = shoe.size_eu ? `EU ${shoe.size_eu}` : 'N/A';
      document.getElementById('detailGender').innerText = shoe.gender || 'N/A';
      document.getElementById('detailCategory').innerText = shoe.category || 'N/A';
      document.getElementById('detailHeel').innerText = shoe.heel_height || 'N/A';
      document.getElementById('detailColor').innerText = Array.isArray(shoe.color) ? shoe.color.join(', ') : (shoe.color || 'N/A');
      document.getElementById('detailTexture').innerText = Array.isArray(shoe.texture) ? shoe.texture.join(', ') : (shoe.texture || 'N/A');
      document.getElementById('detailDate').innerText = shoe.created_at ? new Date(shoe.created_at).toLocaleDateString() : '';

      toggleDetailModal(true);
    }

    function updateLightboxDisplay() {
      document.getElementById('detailImage').src = activeImages[activeImageIdx] || '';

      const prevBtn = document.getElementById('prevImgBtn');
      const nextBtn = document.getElementById('nextImgBtn');
      const thumbnailContainer = document.getElementById('thumbnailContainer');

      if (activeImages.length <= 1) {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        thumbnailContainer.innerHTML = '';
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');

        thumbnailContainer.innerHTML = activeImages.map((imgUrl, idx) => `
          <img src="${imgUrl}" onclick="setLightboxImage(${idx})" class="w-12 h-12 object-cover rounded-md cursor-pointer border-2 transition ${idx === activeImageIdx ? 'border-black scale-105' : 'border-transparent opacity-50 hover:opacity-100'}">
        `).join('');
      }
    }

    function changeLightboxImage(direction) {
      activeImageIdx = (activeImageIdx + direction + activeImages.length) % activeImages.length;
      updateLightboxDisplay();
    }

    function setLightboxImage(idx) {
      activeImageIdx = idx;
      updateLightboxDisplay();
    }

    async function deleteCurrentShoe() {
      if (!currentShoeId) return;
      if (!confirm("Are you sure you wanna get rid of these fine soles?")) return;

      const deleteBtn = document.getElementById('deleteBtn');
      deleteBtn.innerText = "Deleting...";
      deleteBtn.disabled = true;

      try {
        const shoe = allShoes.find(item => item.id === currentShoeId);

        if (shoe && shoe.image_url) {
          const imgs = Array.isArray(shoe.image_url) ? shoe.image_url : [shoe.image_url];

          // Extract strict filenames, removing any query parameters or relative paths
          const fileNames = imgs.map(urlStr => {
            if (!urlStr) return null;
            const cleanUrl = urlStr.split('?')[0];
            return decodeURIComponent(cleanUrl.split('/').pop());
          }).filter(Boolean);

          console.log("Removing storage files:", fileNames);

          if (fileNames.length > 0) {
            const {data, error: storageError} = await db.storage
              .from('shoe-photos')
              .remove(fileNames);

            if (storageError) {
              console.error("Storage delete failed:", storageError.message);
            } else {
              console.log("Storage delete succeeded:", data);
            }
          }
        }

        const {error: dbError} = await db.from('shoes').delete().eq('id', currentShoeId);
        if (dbError) throw dbError;

        toggleDetailModal(false);
        fetchShoes();
      } catch (err) {
        alert("Delete failed: " + err.message);
      } finally {
        deleteBtn.innerText = "Delete Pair";
        deleteBtn.disabled = false;
      }
    }

    function compressImage(file, maxWidth = 1200, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
          };
        };
      });
    }

    async function fetchShoes() {
      const {data, error} = await db.from('shoes').select('*').order('created_at', {ascending: false});
      if (!error && data) {
        allShoes = data;

        const countEl = document.getElementById('shoeCounter');
        if (countEl) {
          countEl.innerText = `Currently ${allShoes.length} ${allShoes.length === 1 ? 'pair' : 'pairs'} available`;
        }

        updateOwnerDropdowns();
        renderApp();
      }
    }

    async function handleUpload(e) {
      e.preventDefault();

      const file1 = document.getElementById('shoeImage1').files[0];
      const file2 = document.getElementById('shoeImage2').files[0];
      const file3 = document.getElementById('shoeImage3').files[0];

      if (!file1) {
        alert("Please select at least a Main Photo.");
        return;
      }

      const ownerVal = document.getElementById('addOwner').value;
      if (!ownerVal || ownerVal === '__NEW__') {
        alert("Please select or add a valid owner.");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Processing Photos...";
      submitBtn.disabled = true;

      const uploadTasks = [
        {num: 1, file: file1},
        {num: 2, file: file2},
        {num: 3, file: file3}
      ].filter(item => Boolean(item.file));

      const uploadedUrls = [];

      try {
        for (const item of uploadTasks) {
          updateCardProgress(item.num, 25, "Compressing");
          const compressedBlob = await compressImage(item.file);

          updateCardProgress(item.num, 60, "Uploading");
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;

          const {error: storageError} = await db.storage
            .from('shoe-photos')
            .upload(fileName, compressedBlob, {contentType: 'image/jpeg'});

          if (storageError) throw storageError;

          updateCardProgress(item.num, 100, "Done");
          const {data: urlData} = db.storage.from('shoe-photos').getPublicUrl(fileName);
          uploadedUrls.push(urlData.publicUrl);
        }

        const newShoe = {
          owner: ownerVal,
          gender: document.getElementById('addGender').value,
          brand: document.getElementById('addBrand').value,
          size_eu: parseFloat(document.getElementById('addSize').value),
          category: document.getElementById('addCategory').value,
          heel_height: document.getElementById('addHeel').value,
          color: [document.getElementById('addColor').value],
          texture: [document.getElementById('addTexture').value],
          image_url: uploadedUrls
        };

        const {error: dbError} = await db.from('shoes').insert([newShoe]);
        if (dbError) throw dbError;

        document.getElementById('uploadForm').reset();
        [1, 2, 3].forEach(n => {
          clearCardImage(e, n);
          updateCardProgress(n, 0);
        });

        toggleUploadModal(false);
        fetchShoes();
      } catch (err) {
        alert("Upload failed: " + err.message);
      } finally {
        submitBtn.innerText = "Compress & Save Pair";
        submitBtn.disabled = false;
        [1, 2, 3].forEach(n => updateCardProgress(n, 0));
      }
    }

    function renderApp() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const owner = document.getElementById('filterOwner').value;
      const gender = document.getElementById('filterGender').value;
      const size = document.getElementById('filterSize').value;
      const category = document.getElementById('filterCategory').value;
      const heel = document.getElementById('filterHeel').value;
      const color = document.getElementById('filterColor').value;
      const texture = document.getElementById('filterTexture').value;

      const filtered = allShoes.filter(shoe => {
        const matchSearch = (shoe.brand || "").toLowerCase().includes(search);
        const matchOwner = owner === 'All' || shoe.owner === owner;
        const matchGender = gender === 'All' || shoe.gender === gender;
        const matchSize = size === 'All' || shoe.size_eu == size;
        const matchCategory = category === 'All' || shoe.category === category;
        const matchHeel = heel === 'All' || shoe.heel_height === heel;
        const matchColor = color === 'All' || (Array.isArray(shoe.color) ? shoe.color.includes(color) : shoe.color === color);
        const matchTexture = texture === 'All' || (Array.isArray(shoe.texture) ? shoe.texture.includes(texture) : shoe.texture === texture);

        return matchSearch && matchOwner && matchGender && matchSize && matchCategory && matchHeel && matchColor && matchTexture;
      });

      const grid = document.getElementById('shoeGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No shoes matching current filters.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(shoe => {
        let mainImgUrl = shoe.image_url;
        if (Array.isArray(shoe.image_url)) {
          mainImgUrl = shoe.image_url[0];
        } else if (typeof shoe.image_url === 'string' && shoe.image_url.startsWith('[')) {
          try {mainImgUrl = JSON.parse(shoe.image_url)[0];} catch { }
        }

        return `
          <div onclick="openShoeDetail(${shoe.id})" class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-0.5 cursor-pointer transition">
            <img src="${mainImgUrl}" alt="${shoe.brand}" class="w-full h-56 object-cover bg-gray-100">
            <div class="p-4">
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-base text-gray-900">${shoe.brand}</h3>
                <span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600 font-medium">${shoe.owner}</span>
              </div>
              <div class="flex flex-wrap gap-1 text-[11px] text-gray-600">
                <span class="bg-gray-50 border px-1.5 py-0.5 rounded">EU ${shoe.size_eu}</span>
                <span class="bg-gray-50 border px-1.5 py-0.5 rounded">${shoe.gender}</span>
                <span class="bg-gray-50 border px-1.5 py-0.5 rounded">${shoe.category}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    fetchShoes();
  </script>
</body>
